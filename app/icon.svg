<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ethnicity Guesser favicon：深色圆角底 + 琥珀地球 + 白色定位点（看脸猜地图） -->
  <rect width="64" height="64" rx="14" fill="#1c1917"/>
  <!-- 地球外圈 -->
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- 经线 -->
  <ellipse cx="32" cy="32" rx="7.5" ry="16.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- 纬线 -->
  <path d="M16.5 32h31" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 中心定位点（猜测 pin） -->
  <circle cx="32" cy="32" r="5" fill="#fafaf9"/>
</svg>
